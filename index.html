<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mobile Harness</title>
    <meta name="description" content="The complete autonomous AI development workspace for Web and Mobile" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mobile Harness" />

    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      /* Prevent layout shifts & style initial fallback */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0B0E14;
        color: #E6EDF3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        text-align: center;
      }
      .initial-logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background-color: #F28C52;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px rgba(242, 140, 82, 0.4);
      }
      .initial-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(242, 140, 82, 0.2);
        border-top-color: #F28C52;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-logo">
          <svg width="32" height="32" viewBox="0 0 108 108" fill="none">
            <path fill="#0B0E14" d="m39 43-10 10 10 10 5-5-5-5 5-5Zm17 0-5 5 5 5-5 5 5 5 10-10Z"/>
          </svg>
        </div>
        <div style="font-size: 19px; font-weight: 800; color: #F28C52; letter-spacing: -0.3px;">
          Mobile Harness
        </div>
        <div class="initial-spinner"></div>
        <div style="font-size: 13px; color: #9AA0A6;">
          Initializing autonomous workspace...
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Clean up any stale service workers from prior failed sessions
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            // Keep active or update
            registration.update();
          }
        });
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
