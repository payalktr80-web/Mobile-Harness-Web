name: Build Android TWA APK with Bubblewrap & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      create_release:
        description: 'Create GitHub Release and upload APK'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-twa:
    name: Build TWA APK (Bubblewrap)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Project Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Preconfigure Bubblewrap Environment
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const os = require("os");
            const confDir = path.join(os.homedir(), ".bubblewrap");
            fs.mkdirSync(confDir, { recursive: true });
            fs.writeFileSync(path.join(confDir, "config.json"), JSON.stringify({
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME
            }, null, 2));
          '
          bubblewrap doctor

      - name: Setup Keystore & Extract Fingerprint (For Zero URL Bar)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'mobileharness123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'mobileharness123' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          elif [ -f "android.keystore" ]; then
            echo "Using existing android.keystore from repo..."
          else
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Mobile Harness Web, OU=MobileHarness, O=TechJarves, L=Global, ST=Global, C=US"
          fi

          SHA256_FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$KEYSTORE_PASSWORD" | grep -i "SHA256:" | head -n 1 | awk '{print $2}')
          echo "Extracted SHA-256: $SHA256_FP"
          echo "sha256=$SHA256_FP" >> $GITHUB_OUTPUT
          echo "SHA256_FINGERPRINT=$SHA256_FP" >> $GITHUB_ENV

          node -e '
            const fs = require("fs");
            const sha256 = process.env.SHA256_FINGERPRINT;
            const content = [{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: "io.github.payalktr80_web.mobile_harness",
                sha256_cert_fingerprints: [sha256]
              }
            }];
            fs.mkdirSync("public/.well-known", { recursive: true });
            fs.mkdirSync("dist/.well-known", { recursive: true });
            fs.writeFileSync("public/.well-known/assetlinks.json", JSON.stringify(content, null, 2));
            fs.writeFileSync("dist/.well-known/assetlinks.json", JSON.stringify(content, null, 2));
            fs.writeFileSync("assetlinks.json", JSON.stringify(content, null, 2));
          '

          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            manifest.fingerprints = [{ value: process.env.SHA256_FINGERPRINT }];
            manifest.display = "standalone";
            manifest.enableSiteSettingsShortcut = false;
            fs.writeFileSync("twa-manifest.json", JSON.stringify(manifest, null, 2));
          '

      - name: Build Android Package with Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'mobileharness123' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'mobileharness123' }}
        run: |
          bubblewrap update --manifest=twa-manifest.json --skipVersionUpgrade --skipPwaValidation
          bubblewrap build --skipPwaValidation

      - name: Prepare Release Artifacts
        id: artifacts
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              VERSION="1.0.0"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          if [ -f "app-release-signed.apk" ]; then
            cp app-release-signed.apk "MobileHarness-v${VERSION}-signed.apk"
            echo "apk=MobileHarness-v${VERSION}-signed.apk" >> $GITHUB_OUTPUT
          fi

          if [ -f "app-release-bundle.aab" ]; then
            cp app-release-bundle.aab "MobileHarness-v${VERSION}-bundle.aab"
            echo "aab=MobileHarness-v${VERSION}-bundle.aab" >> $GITHUB_OUTPUT
          fi

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: MobileHarness-Android-TWA
          path: |
            MobileHarness-*-signed.apk
            MobileHarness-*-bundle.aab
            assetlinks.json

      - name: Create GitHub Release and Upload APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.artifacts.outputs.tag }}
          name: "Mobile Harness Web v${{ steps.artifacts.outputs.version }} (Android TWA)"
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## 📱 Mobile Harness Web - Android TWA Release (v${{ steps.artifacts.outputs.version }})

            Automated Android package built from the Progressive Web App using **Google Bubblewrap CLI**.

            ### 🚀 Highlights:
            - **No URL Bars / Full Standalone Mode**: Digital Asset Links verified with Google Chrome TWA engine. The browser address bar and controls are completely hidden.
            - **Pyodide WebAssembly Python 3.12**: Run Python code and install packages with `micropip` in-browser.
            - **Claude Code Replicate**: Full autonomous coding agent harness with tool calling and diff reviews.
            - **Offline PWA Support**: Fast local caching with Service Worker.

            ### 📦 Downloads:
            - **APK (Direct Android Install)**: `MobileHarness-v${{ steps.artifacts.outputs.version }}-signed.apk`
            - **AAB (Google Play Store Bundle)**: `MobileHarness-v${{ steps.artifacts.outputs.version }}-bundle.aab`
            - **Digital Asset Links**: `assetlinks.json` (SHA-256: `${{ steps.keystore.outputs.sha256 }}`)
          files: |
            MobileHarness-*-signed.apk
            MobileHarness-*-bundle.aab
            assetlinks.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
